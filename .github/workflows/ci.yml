name: Test plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit, race and static tests (mock services only)
        working-directory: backend
        run: |
          go test -race -cover ./...
          go vet ./...
      - name: Sidecar protocol smoke (mock MCP only)
        run: node scripts/protocol-smoke.mjs
      - name: Check frontend syntax
        run: node --check ui/app.js
      - name: Build macOS arm64 unsigned candidate
        run: node scripts/build.mjs darwin-arm64
      - name: Verify package integrity
        run: python3 scripts/verify-package.py dist/*.dbxp
